<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Fira Code', 'Courier New', monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="800" height="500" fill="#f8fafc"/>
  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Fragments Microservice — Architecture</text>

  <!-- Client -->
  <rect x="40" y="200" width="130" height="70" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
  <text x="105" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Client</text>
  <text x="105" y="250" text-anchor="middle" font-size="10" fill="#475569">fragments-ui</text>

  <!-- Cognito -->
  <rect x="250" y="70" width="180" height="70" rx="8" fill="#fee2e2" stroke="#991b1b" stroke-width="1.5"/>
  <text x="340" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Amazon Cognito</text>
  <text x="340" y="118" text-anchor="middle" font-size="10" fill="#475569">authN / authZ · JWT</text>

  <!-- Express API -->
  <rect x="250" y="190" width="180" height="90" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
  <text x="340" y="218" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Express API</text>
  <text x="340" y="238" text-anchor="middle" font-size="10" fill="#475569">auth middleware (edge)</text>
  <text x="340" y="254" text-anchor="middle" font-size="10" fill="#475569">CRUD /v1/fragments</text>

  <!-- DynamoDB -->
  <rect x="560" y="130" width="190" height="70" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/>
  <text x="655" y="158" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">DynamoDB</text>
  <text x="655" y="178" text-anchor="middle" font-size="10" fill="#475569">fragment metadata</text>

  <!-- S3 -->
  <rect x="560" y="250" width="190" height="70" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/>
  <text x="655" y="278" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Amazon S3</text>
  <text x="655" y="298" text-anchor="middle" font-size="10" fill="#475569">binary content</text>

  <!-- Arrows -->
  <!-- Client -> Cognito -->
  <path d="M 170 215 L 245 115" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="175" y="150" font-size="10" fill="#475569">1. sign in</text>
  <!-- Cognito -> Client (token) -->
  <path d="M 260 145 L 145 197" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="150" y="185" font-size="10" fill="#475569">2. token</text>
  <!-- Client -> Express -->
  <path d="M 170 235 L 245 235" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="177" y="227" font-size="10" fill="#475569">3. Bearer</text>
  <!-- Express -> Cognito (verify) -->
  <path d="M 340 190 L 340 145" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="348" y="172" font-size="10" fill="#475569">verify JWT</text>
  <!-- Express -> DynamoDB -->
  <path d="M 430 215 L 555 175" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="452" y="185" font-size="10" fill="#475569">metadata</text>
  <!-- Express -> S3 -->
  <path d="M 430 255 L 555 285" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="462" y="285" font-size="10" fill="#475569">binary data</text>

  <!-- CI/CD lane -->
  <rect x="40" y="380" width="710" height="85" rx="8" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="55" y="402" font-size="11" font-weight="bold" fill="#475569">CI / CD &amp; Testing</text>

  <rect x="70" y="412" width="130" height="40" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="1.2"/>
  <text x="135" y="437" text-anchor="middle" font-size="11" fill="#0f172a">Docker</text>

  <rect x="270" y="412" width="170" height="40" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="1.2"/>
  <text x="355" y="437" text-anchor="middle" font-size="11" fill="#0f172a">GitHub Actions</text>

  <rect x="510" y="412" width="210" height="40" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="1.2"/>
  <text x="615" y="430" text-anchor="middle" font-size="11" fill="#0f172a">LocalStack</text>
  <text x="615" y="445" text-anchor="middle" font-size="9" fill="#475569">Jest · Supertest · Hurl</text>

  <path d="M 200 432 L 265 432" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 440 432 L 505 432" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#arrow)"/>
</svg>
